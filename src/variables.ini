# ============================================================
# STATBOX COLOR THRESHOLDS
# Format: <category>.<field>=<value>
#
# direction = "high" -> higher values are better (green when high)
# direction = "low"  -> lower values are better (green when low)
#
# Logic for direction "high":
#   value >= green   -> GREEN border
#   value >= orange  -> ORANGE border
#   else             -> RED border
#
# Logic for direction "low":
#   value <= green   -> GREEN border
#   value <= orange  -> ORANGE border
#   else             -> RED border
#
# Categories: cash, pops, loyalty, workers, accomm, sick, power
# Lines starting with '#' or empty lines are ignored.
# ============================================================

cash.direction=high
cash.green=10000
cash.orange=1000

pops.direction=high
pops.green=100
pops.orange=10

loyalty.direction=high
loyalty.green=70
loyalty.orange=40

workers.direction=high
workers.green=50
workers.orange=10

accomm.direction=high
accomm.green=100
accomm.orange=10

sick.direction=low
sick.green=5
sick.orange=20

power.direction=high
power.green=50
power.orange=10
